# Dev: `docker compose up -d languagetool`. Production (VPS): `docker compose --profile prod up -d --build`.
# Self-hosted because the public LanguageTool API forbids automated requests (SPEC §11).
# Image pulled via mirror.gcr.io (Docker Hub mirror) to avoid Docker Hub pull rate limits.
services:
  languagetool:
    image: mirror.gcr.io/erikvl87/languagetool:6.8
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/v2/languages >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    profiles: ["prod"]
    build: .
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////data/ustad.db
      LANGUAGETOOL_URL: http://languagetool:8010
    volumes:
      - ustad-data:/data
    depends_on:
      - languagetool
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: mirror.gcr.io/library/caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ustad-data:
  caddy-data:
  caddy-config:
